<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OIKOS · Reels</title>
<style>
  @font-face { font-family:'Playfair Display'; font-weight:600; src:url(fonts/PlayfairDisplay-600.ttf); }
  @font-face { font-family:'Playfair Display'; font-weight:700; src:url(fonts/PlayfairDisplay-700.ttf); }
  @font-face { font-family:'Playfair Display'; font-weight:500; font-style:italic; src:url(fonts/PlayfairDisplay-500i.ttf); }
  @font-face { font-family:'Playfair Display'; font-weight:600; font-style:italic; src:url(fonts/PlayfairDisplay-600i.ttf); }
  @font-face { font-family:'Inter'; font-weight:400; src:url(fonts/Inter-400.ttf); }
  @font-face { font-family:'Inter'; font-weight:500; src:url(fonts/Inter-500.ttf); }
  @font-face { font-family:'Inter'; font-weight:600; src:url(fonts/Inter-600.ttf); }
  @font-face { font-family:'Inter'; font-weight:700; src:url(fonts/Inter-700.ttf); }
  @font-face { font-family:'Inter'; font-weight:800; src:url(fonts/Inter-800.ttf); }

  :root { --black:#080808; --white:#fff; --cream:#efe9df; --accent:#c9b99a; --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#111; color:var(--white); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  body.preview { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  .viewport { position:relative; overflow:hidden; border-radius:14px; box-shadow:0 30px 90px rgba(0,0,0,.6); }
  .controls { display:flex; align-items:center; gap:12px; width:min(100%,520px); font-size:13px; color:#aaa; }
  .controls button { background:#fff; color:#000; border:0; border-radius:999px; width:40px; height:40px; font-size:15px; cursor:pointer; flex:none; }
  .controls input[type=range] { flex:1; accent-color:var(--accent); }
  .controls .time { font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }
  .controls label { display:flex; gap:6px; align-items:center; white-space:nowrap; cursor:pointer; }
  .hint { font-size:12px; color:#777; text-align:center; max-width:520px; }
  body.render { width:1080px; height:1920px; overflow:hidden; }
  body.render .controls, body.render .hint { display:none; }
  body.render .viewport { border-radius:0; box-shadow:none; }

  /* Palco 1080×1920 */
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--black); transform-origin:0 0; overflow:hidden; }
  .scene { position:absolute; inset:0; overflow:hidden; background:var(--black); visibility:hidden; will-change:transform, filter, opacity; }
  .scene img.ph { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; filter:contrast(1.06) saturate(1.12) brightness(1.04); }
  .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 52%, rgba(0,0,0,.5) 72%, rgba(0,0,0,.8) 100%); }
  .vig { position:absolute; inset:0; background:radial-gradient(ellipse 85% 70% at 50% 50%, transparent 60%, rgba(0,0,0,.3) 100%); pointer-events:none; }

  /* Texto das cenas — fica dentro da área segura do Reels */
  .txt { position:absolute; left:72px; right:170px; bottom:330px; }
  .kick { display:flex; align-items:center; gap:22px; font-weight:800; font-size:44px; letter-spacing:.2em; text-transform:uppercase; color:var(--white); }
  .kick::before { content:''; width:64px; height:6px; background:var(--accent); flex:none; transform-origin:0 50%; transform:scaleX(var(--bar,1)); }
  .ttl { font-family:var(--serif); font-style:italic; font-weight:500; font-size:124px; line-height:1.02; margin-top:18px; color:var(--cream); text-shadow:0 6px 40px rgba(0,0,0,.45); }
  .w { display:inline-block; white-space:pre; will-change:transform, opacity, filter; }

  /* Gancho */
  .hook .shade { background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 30%, rgba(0,0,0,.15) 55%, rgba(0,0,0,.75) 100%); }
  .hook .txt { left:72px; right:72px; bottom:auto; top:430px; text-align:center; }
  .hook .kick { justify-content:center; font-size:46px; letter-spacing:.06em; text-transform:none; font-weight:600; color:var(--cream); }
  .hook .kick::before { display:none; }
  .hook .ttl { font-family:var(--sans); font-style:normal; font-weight:800; font-size:170px; line-height:.95; letter-spacing:-.02em; text-transform:uppercase; color:#fff; margin-top:34px; }
  .hook .arrow { position:absolute; left:50%; bottom:380px; width:84px; height:84px; margin-left:-42px; border:3px solid rgba(255,255,255,.8); border-radius:50%; display:grid; place-items:center; }
  .hook .arrow svg { width:36px; height:36px; }

  /* Cartela de seção */
  .sec img.ph { filter:blur(26px) brightness(.42) saturate(.9); }
  .sec .box { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 90px; }
  .sec .num { font-family:var(--serif); font-weight:700; font-size:120px; color:var(--accent); line-height:1; }
  .sec .big { font-weight:800; font-size:116px; line-height:.95; text-transform:uppercase; letter-spacing:-.02em; margin-top:30px; }
  .sec .line { height:6px; width:240px; background:var(--accent); margin-top:56px; transform-origin:0 50%; }

  /* Final */
  .fin img.ph { filter:brightness(.5) saturate(1.05); }
  .fin .box { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 80px 120px; }
  .fin svg.logo { width:120px; height:130px; }
  .fin .bn { font-family:var(--serif); font-weight:700; font-size:64px; letter-spacing:.3em; margin-right:-.3em; margin-top:24px; }
  .fin .bs { font-size:22px; letter-spacing:.5em; margin-right:-.5em; text-transform:uppercase; color:#ddd; margin-top:10px; }
  .fin h2 { font-weight:800; font-size:118px; line-height:.98; text-transform:uppercase; letter-spacing:-.02em; margin-top:110px; }
  .fin .wa { display:flex; align-items:center; gap:22px; margin-top:70px; background:#fff; color:#000; padding:34px 54px; border-radius:999px; font-size:54px; font-weight:700; font-variant-numeric:tabular-nums; }
  .fin .wa svg { width:62px; height:62px; color:#25d366; }
  .fin .ig { font-size:40px; font-weight:500; color:var(--cream); margin-top:44px; }

  /* Camadas fixas */
  #brand { position:absolute; left:72px; top:120px; display:flex; align-items:center; gap:16px; z-index:50; filter:drop-shadow(0 2px 14px rgba(0,0,0,.5)); }
  #brand svg { width:44px; height:48px; }
  #brand b { font-family:var(--serif); font-weight:700; font-size:34px; letter-spacing:.24em; }
  #foot { position:absolute; left:0; right:0; bottom:120px; text-align:center; font-size:22px; letter-spacing:.08em; color:rgba(255,255,255,.62); z-index:50; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; z-index:60; pointer-events:none; }
  #leak { position:absolute; inset:0; z-index:55; opacity:0; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(ellipse 60% 45% at 85% 20%, rgba(255,190,120,.9), transparent 70%), radial-gradient(ellipse 50% 40% at 10% 85%, rgba(255,150,90,.6), transparent 70%); }
  #safe { position:absolute; inset:0; z-index:70; pointer-events:none; display:none;
          background:linear-gradient(#f005,#f005) top/100% 108px no-repeat, linear-gradient(#f005,#f005) bottom/100% 280px no-repeat, linear-gradient(#f005,#f005) right 280px/150px 700px no-repeat; }
  body.show-safe #safe { display:block; }
</style>
</head>
<body>
  <div class="viewport" id="viewport">
    <div id="stage">
      <div id="brand"></div><div id="foot"></div><div id="leak"></div><div id="flash"></div><div id="safe"></div>
    </div>
  </div>
  <div class="controls">
    <button id="play" aria-label="Reproduzir">▶</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição">
    <span class="time" id="time">0,0 s</span>
    <label><input type="checkbox" id="safeT"> área segura</label>
  </div>
  <p class="hint">Prévia do Reels. Edite <b>video/imoveis.js</b> e recarregue. Gerar MP4: <code>node video/gerar-video.js</code></p>

<script src="imoveis.js"></script>
<script>
(() => {
  const D = window.VIDEO_DATA, C = D.config;
  const W = 1080, H = 1920, BEAT = 60 / (C.bpm || 120);
  const RENDER = new URLSearchParams(location.search).has('render');
  document.body.classList.add(RENDER ? 'render' : 'preview');

  /* ---------- easing ---------- */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
  const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const inQuad = x => x * x;
  const seg = (t, s, d, e = outCubic) => e(clamp((t - s) / d));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const words = s => esc(s).split(/(\s+)/).filter(Boolean).map(w => /^\s+$/.test(w) ? w : `<span class="w">${w}</span>`).join('');

  const ARCH = `<svg viewBox="0 0 48 52" fill="none"><rect x="4" y="22" width="6" height="28" fill="#fff"/><rect x="38" y="22" width="6" height="28" fill="#fff"/><rect x="21" y="30" width="6" height="20" fill="#fff"/><path d="M4 22 C4 6 44 6 44 22" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`;
  const WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2c2.6 0 5.1 1 6.9 2.9 1.8 1.8 2.9 4.3 2.9 6.9 0 5.4-4.4 9.8-9.8 9.8zM20.5 3.5C18.2 1.2 15.2 0 12 0 5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.8 1 3.8 1.5 5.8 1.5 6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.4z"/></svg>';

  const stage = document.getElementById('stage');
  const brand = document.getElementById('brand'), foot = document.getElementById('foot');
  const flash = document.getElementById('flash'), leak = document.getElementById('leak');
  brand.innerHTML = ARCH + `<b>${esc(D.marca.nome)}</b>`;
  foot.textContent = D.rodape || '';

  /* ---------- foto com movimento de câmera ---------- */
  function photo(el, src) {
    const img = new Image(); img.className = 'ph'; img.src = src; img.decoding = 'sync';
    el.prepend(img);
    return {
      img,
      // z = zoom (1 = preenche a tela), px/py = 0..1 posição do enquadramento
      place(z, px, py = 0.5) {
        const iw = img.naturalWidth || W, ih = img.naturalHeight || H;
        const s = Math.max(W / iw, H / ih);
        const dw = iw * s * z, dh = ih * s * z;
        img.style.width = iw * s + 'px'; img.style.height = ih * s + 'px';
        img.style.transform = `translate(${-(dw - W) * px}px, ${-(dh - H) * py}px) scale(${z})`;
      },
    };
  }
  function camera(c, lt, dur, punch) {
    const p = clamp(lt / dur);
    const f = c.foco ?? 0.5;
    let z = 1.04, px = f;
    switch (c.movimento) {
      case 'zoom-out':     z = 1.16 - 0.12 * p; break;
      case 'pan-direita':  z = 1.02; px = 0.08 + 0.84 * inOut(p) * 0.95; break;
      case 'pan-esquerda': z = 1.02; px = 0.92 - 0.84 * inOut(p) * 0.95; break;
      default:             z = 1.02 + 0.14 * p;
    }
    if (punch) z *= 1 + 0.22 * (1 - outExpo(clamp(lt / 0.45)));   // "soco" de zoom no corte
    return { z, px };
  }
  // texto palavra a palavra
  function animWords(list, t0, lt, stagger = 0.07, dist = 70) {
    list.forEach((w, k) => {
      const p = seg(lt, t0 + k * stagger, 0.42, outExpo);
      w.style.opacity = p;
      w.style.transform = `translateY(${(1 - p) * dist}px) scale(${1.12 - 0.12 * p})`;
      w.style.filter = `blur(${(1 - p) * 14}px)`;
    });
  }

  /* ---------- montar cenas ---------- */
  const scenes = [];
  let t0 = 0;
  D.cenas.forEach((c, i) => {
    const dur = (c.batidas || 3) * BEAT;
    const el = document.createElement('div');
    const tipo = c.tipo || 'foto';
    el.className = 'scene ' + ({ gancho: 'hook', secao: 'sec', final: 'fin' }[tipo] || 'shot');
    let render;

    if (tipo === 'secao') {
      el.innerHTML = `<div class="box"><div class="num">${esc(c.numero || '')}</div><div class="big">${words(c.titulo)}</div><div class="line"></div></div>`;
      const ph = photo(el, c.foto); const ws = [...el.querySelectorAll('.w')];
      render = lt => {
        ph.place(1.15 + 0.05 * (lt / dur), 0.5);
        const n = el.querySelector('.num'), pn = seg(lt, 0.05, 0.35, outExpo);
        n.style.opacity = pn; n.style.transform = `translateX(${(1 - pn) * -80}px)`;
        animWords(ws, 0.12, lt, 0.09, 110);
        el.querySelector('.line').style.transform = `scaleX(${seg(lt, 0.3, 0.5, outExpo)})`;
      };
    } else if (tipo === 'final') {
      const ct = D.contato;
      el.innerHTML = `<div class="shade"></div><div class="box">
        ${ARCH.replace('<svg', '<svg class="logo"')}
        <div class="bn">${esc(D.marca.nome)}</div><div class="bs">${esc(D.marca.sub)}</div>
        <h2>${words(ct.titulo)}</h2>
        ${ct.whatsapp ? `<div class="wa">${WA}<span>${esc(ct.whatsapp)}</span></div>` : ''}
        ${ct.instagram ? `<div class="ig">${esc(ct.instagram)}</div>` : ''}</div>`;
      const ph = photo(el, c.foto); const ws = [...el.querySelectorAll('h2 .w')];
      const q = s => el.querySelector(s);
      render = lt => {
        ph.place(1.0 + 0.08 * (lt / dur), c.foco ?? 0.5);
        const pl = seg(lt, 0.1, 0.6, outExpo);
        ['.logo', '.bn', '.bs'].forEach((s, k) => { const p = seg(lt, 0.1 + k * 0.08, 0.6, outExpo); q(s).style.opacity = p; q(s).style.transform = `translateY(${(1 - p) * 40}px)`; });
        animWords(ws, 0.45, lt, 0.1, 90);
        const wa = q('.wa'); if (wa) { const p = seg(lt, 0.9, 0.5, outExpo); wa.style.opacity = p; wa.style.transform = `scale(${0.8 + 0.2 * p})`; }
        const ig = q('.ig'); if (ig) { const p = seg(lt, 1.1, 0.5); ig.style.opacity = p; ig.style.transform = `translateY(${(1 - p) * 30}px)`; }
        // pulso leve no botão do WhatsApp
        if (wa && lt > 1.6) wa.style.transform = `scale(${1 + 0.03 * Math.sin((lt - 1.6) * Math.PI * 2 / (BEAT * 2))})`;
        el.style.opacity = 1 - seg(lt, dur - 0.5, 0.5, inOut);
        void pl;
      };
    } else {
      el.innerHTML = `<div class="shade"></div><div class="vig"></div>
        ${c.legenda || c.titulo ? `<div class="txt">${c.legenda ? `<div class="kick">${words(c.legenda)}</div>` : ''}${c.titulo ? `<div class="ttl">${words(c.titulo)}</div>` : ''}</div>` : ''}
        ${tipo === 'gancho' ? '<div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>' : ''}`;
      const ph = photo(el, c.foto);
      const kw = [...el.querySelectorAll('.kick .w')], tw = [...el.querySelectorAll('.ttl .w')];
      const kick = el.querySelector('.kick'), arrow = el.querySelector('.arrow');
      const punch = ['zoom', 'flash'].includes(c.transicao) || tipo === 'gancho';
      render = lt => {
        const cam = camera(c, lt, dur, punch);
        ph.place(cam.z, cam.px);
        const d0 = tipo === 'gancho' ? 0.1 : 0.12;
        if (kick) kick.style.setProperty('--bar', seg(lt, d0, 0.4, outExpo));
        animWords(kw, d0, lt, 0.06, 50);
        animWords(tw, d0 + 0.14 + kw.length * 0.06, lt, tipo === 'gancho' ? 0.16 : 0.08, tipo === 'gancho' ? 120 : 80);
        if (arrow) { const p = seg(lt, 1.2, 0.4); arrow.style.opacity = p; arrow.style.transform = `translateY(${Math.sin(lt * 7) * 10}px)`; }
      };
    }
    stage.insertBefore(el, brand);
    scenes.push({ c, tipo, el, start: t0, dur, render, trans: i === 0 ? 'corte' : (c.transicao || 'corte') });
    t0 += dur;
  });
  const TOTAL = t0;

  /* ---------- transições ---------- */
  const TR = {
    corte: { d: 0 },
    flash: { d: 0.3, run(p) { flash.style.opacity = 0.95 * (1 - outCubic(p)); leak.style.opacity = 0.7 * (1 - p); } , prev: false },
    whip:  { d: 0.28, prev: true, run(p, a, b) {
      const e = inOut(p);
      a.style.transform = `translateX(${-e * W}px)`; a.style.filter = `blur(${Math.sin(e * Math.PI) * 40}px)`;
      b.style.transform = `translateX(${(1 - e) * W}px)`; b.style.filter = `blur(${Math.sin(e * Math.PI) * 40}px)`;
    } },
    zoom:  { d: 0.32, prev: true, run(p, a, b) {
      const e = inQuad(p);
      a.style.transform = `scale(${1 + e * 0.9})`; a.style.filter = `blur(${e * 30}px)`; a.style.opacity = 1 - e;
      leak.style.opacity = 0.5 * Math.sin(p * Math.PI);
    } },
  };

  function reset(el) { el.style.transform = ''; el.style.filter = ''; el.style.opacity = 1; el.style.visibility = 'hidden'; }

  function renderAt(t) {
    t = clamp(t, 0, TOTAL - 1e-4);
    let k = scenes.findIndex(s => t < s.start + s.dur); if (k < 0) k = scenes.length - 1;
    const cur = scenes[k], lt = t - cur.start;
    scenes.forEach(s => reset(s.el));
    flash.style.opacity = 0; leak.style.opacity = 0;
    cur.el.style.visibility = 'visible'; cur.el.style.zIndex = 2;
    cur.render(lt);
    const tr = TR[cur.trans] || TR.corte;
    if (k > 0 && tr.d && lt < tr.d) {
      const prev = scenes[k - 1];
      if (tr.prev) { prev.el.style.visibility = 'visible'; prev.el.style.zIndex = cur.trans === 'zoom' ? 3 : 1; prev.render(prev.dur + lt); }
      tr.run(lt / tr.d, prev.el, cur.el);
    }
    const isFinal = cur.tipo === 'final' || cur.tipo === 'secao';
    brand.style.opacity = isFinal ? 0 : 1;
    foot.style.opacity = 1;
  }

  /* ---------- prévia ---------- */
  const vp = document.getElementById('viewport');
  function fit() {
    if (RENDER) { vp.style.width = W + 'px'; vp.style.height = H + 'px'; return; }
    const s = Math.min((innerHeight - 130) / H, (innerWidth - 32) / W, 1);
    vp.style.width = W * s + 'px'; vp.style.height = H * s + 'px'; stage.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const ready = Promise.all([document.fonts.ready, ...[...stage.querySelectorAll('img')].map(i => i.decode().catch(() => console.warn('Foto não encontrada:', i.getAttribute('src'))))]);
  window.VIDEO = { renderAt, duration: TOTAL, fps: C.fps || 30, musica: C.musica || '', ready };

  if (!RENDER) {
    const btn = document.getElementById('play'), seek = document.getElementById('seek'), time = document.getElementById('time');
    document.getElementById('safeT').onchange = e => document.body.classList.toggle('show-safe', e.target.checked);
    const fmt = x => x.toFixed(1).replace('.', ',');
    let cur = 0, playing = false, last = 0;
    const show = () => { renderAt(cur); seek.value = Math.round(cur / TOTAL * 1000); time.textContent = `${fmt(cur)} / ${fmt(TOTAL)} s`; };
    const loop = now => { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur >= TOTAL) cur = 0; show(); requestAnimationFrame(loop); };
    const toggle = () => { playing = !playing; btn.textContent = playing ? '❚❚' : '▶'; if (playing) { last = performance.now(); requestAnimationFrame(loop); } };
    btn.onclick = toggle;
    seek.oninput = () => { cur = seek.value / 1000 * TOTAL; show(); };
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
    ready.then(() => { show(); toggle(); });
  } else renderAt(0);
})();
</script>
</body>
</html>
